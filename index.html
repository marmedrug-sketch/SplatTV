<style>
  :root { --bg:#0b0b0d; --orange:#ff7a00; --live:#ff2d3d; --muted:#8a8a93; --panel:#17171b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: #fff;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(14px, 3vh, 28px); padding: 20px 16px;
  }
  .logo { display:block; width: clamp(170px, 26vw, 300px); height:auto; user-select:none; -webkit-user-drag:none; }

  .status {
    display:inline-flex; align-items:center; gap:10px; padding:9px 20px; border-radius:999px;
    background: var(--panel); color: var(--muted); font-weight:800;
    font-size: clamp(14px, 2.2vw, 18px); letter-spacing:.06em;
    border:1px solid #26262c; transition: background .3s, color .3s, border-color .3s;
  }
  .status .dot { width:11px; height:11px; border-radius:50%; background:#55555d; }
  .status.live { background: var(--live); border-color: var(--live); color:#fff; }
  .status.live .dot { background:#fff; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% {opacity:1; transform:scale(1);} 50% {opacity:.35; transform:scale(.75);} }

  .stage {
    width: min(100%, 1100px); aspect-ratio: 16 / 9; background:#000;
    border-radius:14px; overflow:hidden; border:1px solid #26262c;
    transition: border-color .3s, box-shadow .3s;
  }
  .stage.live { border-color: var(--orange); box-shadow: 0 0 40px rgba(255,122,0,.25); }
  .stage iframe { width:100%; height:100%; border:0; display:block; }

  @media (prefers-reduced-motion: reduce) { .status.live .dot { animation:none; } }
</style>
</head>
