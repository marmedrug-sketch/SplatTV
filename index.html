<style>
  :root {
    --bg: #0b0b0d;
    --orange: #ff7a00;
    --live: #ff2d3d;
    --text: #ffffff;
    --muted: #8a8a93;
    --panel: #17171b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(14px, 3vh, 28px);
    padding: 20px 16px;
  }

  .logo {
    display: block;
    width: clamp(170px, 26vw, 300px);
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* Статус эфира */
  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 9px 20px;
    border-radius: 999px;
    background: var(--panel);
    color: var(--muted);
    font-weight: 800;
    font-size: clamp(14px, 2.2vw, 18px);
    letter-spacing: .06em;
    border: 1px solid #26262c;
    transition: background .3s, color .3s, border-color .3s;
  }
  .status .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #55555d;
    transition: background .3s;
  }
  .status.live {
    background: var(--live);
    border-color: var(--live);
    color: #fff;
  }
  .status.live .dot {
    background: #fff;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .35; transform: scale(.75); }
  }

  /* Плеер */
  .stage {
    position: relative;
    width: min(100%, 1100px);
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #26262c;
    transition: border-color .3s, box-shadow .3s;
  }
  .stage.live {
    border-color: var(--orange);
    box-shadow: 0 0 40px rgba(255, 122, 0, .25);
  }
  video {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
    object-fit: contain;
  }
  .sound {
    position: absolute;
    left: 14px;
    bottom: 14px;
    display: none;
    padding: 9px 16px;
    border: 0;
    border-radius: 999px;
    background: var(--orange);
    color: #000;
    font: 700 14px/1 "Segoe UI", Arial, sans-serif;
    cursor: pointer;
  }
  .sound.show { display: block; }
  .sound:hover { filter: brightness(1.1); }
  .stage.has-controls .sound { bottom: 62px; }

  @media (prefers-reduced-motion: reduce) {
    .status.live .dot { animation: none; }
  }
</style>
</head>

<script>
  // ====== НАСТРОЙКА ======
  // Адрес HLS-потока (.m3u8) вашего сервера.
  var STREAM_URL = 'https://37f500a596ab3e6c-187-7-207-10.serveousercontent.com/live/index.m3u8';

  var RETRY_MS = 5000;   // как часто проверять, начался ли эфир
  var STALL_MS = 15000;  // сколько секунд без движения кадра считать концом эфира
  // =======================

  var video = document.getElementById('video');
  var stage = document.getElementById('stage');
  var statusEl = document.getElementById('status');
  var statusText = document.getElementById('statusText');
  var soundBtn = document.getElementById('sound');

  var hls = null;
  var live = false;
  var retryTimer = null;
  var lastTime = -1;
  var lastProgress = Date.now();
  var currentFp = null;  // «отпечаток» текущего плейлиста
  var staleFp = null;    // плейлист, на котором эфир замер (сервер мог оставить старый файл)

  function setLive(on) {
    if (on === live) return;
    live = on;
    statusEl.classList.toggle('live', on);
    stage.classList.toggle('live', on);
    stage.classList.toggle('has-controls', on);
    statusText.textContent = on ? 'ПРЯМОЙ ЭФИР' : 'Нет эфира';
    if (on) video.setAttribute('controls', '');
    else video.removeAttribute('controls');
    updateSoundButton();
  }

  function updateSoundButton() {
    soundBtn.classList.toggle('show', live && video.muted);
  }

  function teardown() {
    if (hls) { hls.destroy(); hls = null; }
    video.removeAttribute('src');
    video.load();
  }

  function goOffline() {
    setLive(false);
    teardown();
    clearTimeout(retryTimer);
    retryTimer = setTimeout(start, RETRY_MS);
  }

  function start() {
    clearTimeout(retryTimer);
    teardown();
    lastTime = -1;
    lastProgress = Date.now();

    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({
        lowLatencyMode: true,
        manifestLoadingMaxRetry: 0,
        levelLoadingMaxRetry: 2,
        fragLoadingMaxRetry: 3
      });
      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        var p = video.play();
        if (p && p.catch) p.catch(function () {});
      });
      hls.on(Hls.Events.LEVEL_LOADED, function (e, data) {
        var d = data && data.details;
        if (!d) return;
        if (d.live === false) { goOffline(); return; }      // плейлист закрыт (ENDLIST) — эфир закончен
        var f = d.fragments && d.fragments.length ? d.fragments[d.fragments.length - 1] : null;
        currentFp = d.endSN + '|' + (f ? f.relurl : '');
        if (staleFp) {
          if (currentFp === staleFp) { goOffline(); return; } // тот же старый плейлист — эфира нет
          staleFp = null;                                      // появились новые данные — эфир вернулся
        }
      });
      hls.on(Hls.Events.ERROR, function (e, data) {
        if (data && data.fatal) goOffline();
      });
      hls.loadSource(STREAM_URL);
      hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Safari и iOS играют HLS сами
      video.src = STREAM_URL;
      var p = video.play();
      if (p && p.catch) p.catch(function () {});
    } else {
      goOffline();
    }
  }

  // Эфир пошёл: кадры реально воспроизводятся
  video.addEventListener('playing', function () {
    lastProgress = Date.now();
    setLive(true);
  });
  video.addEventListener('timeupdate', function () {
    if (video.currentTime !== lastTime) {
      lastTime = video.currentTime;
      lastProgress = Date.now();
    }
  });
  video.addEventListener('error', function () { if (live || video.src) goOffline(); });
  video.addEventListener('ended', function () { staleFp = currentFp; goOffline(); });
  video.addEventListener('volumechange', updateSoundButton);

  soundBtn.addEventListener('click', function () {
    video.muted = false;
    video.volume = 1;
    updateSoundButton();
  });

  // Сторож: если эфир идёт, но кадр замер надолго — эфир закончился
  setInterval(function () {
    if (live && !video.paused && Date.now() - lastProgress > STALL_MS) {
      staleFp = currentFp;
      goOffline();
    }
  }, 2000);

  start();
</script>
